<nav style="background:#333; padding:10px; color:white; display:flex; justify-content:space-between;">

  <!-- LEFT SIDE -->
  <div>
    <span style="margin-right:20px;">Student App</span>

    <!-- 🌐 PUBLIC MENU -->
    <a routerLink="/about" style="margin-right:15px; color:white;">About</a>
    <a routerLink="/career" style="margin-right:15px; color:white;">Career</a>

    <!-- 🔐 AFTER LOGIN -->
    <ng-container *ngIf="isLoggedIn">

      <!-- 👨‍🎓 Student List (ALL users) -->
      <a routerLink="/students" style="margin-right:15px; color:white;">
        Students
      </a>

      <!-- 👑 ADMIN ONLY -->
      <a *ngIf="role === 'Admin'" 
         routerLink="/students/add" 
         style="margin-right:15px; color:white;">
        Add Student
      </a>

    </ng-container>
  </div>

  <!-- RIGHT SIDE -->
  <div>

    <!-- 🔐 LOGIN FORM -->
    <ng-container *ngIf="!isLoggedIn">

      <input 
        [(ngModel)]="user.username"
        name="username"
        placeholder="Username"
        style="margin-right:5px;"
      >

      <input 
        [(ngModel)]="user.password"
        name="password"
        type="password"
        placeholder="Password"
        style="margin-right:5px;"
      >

      <button (click)="login()">Login</button>

      <span style="color:red; margin-left:10px;">
        {{ errorMsg }}
      </span>

    </ng-container>

    <!-- 🔓 LOGGED IN -->
    <ng-container *ngIf="isLoggedIn">

      <span style="margin-right:10px;">{{ role }}</span>

      <button (click)="logout()">Logout</button>

    </ng-container>

  </div>

</nav>
